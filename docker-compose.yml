services:
  mysql:
    image: mysql:8.0
    container_name: sse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    container_name: sse-api
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3000" 

  frontend:
    build: ./frontend
    container_name: sse-frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysqldata:
