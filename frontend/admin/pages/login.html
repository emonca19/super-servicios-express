<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iniciar sesión - Admin</title>
    <link rel="stylesheet" href="../assets/css/admin-layout.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card" role="dialog" aria-labelledby="loginTitle">
        <div class="brand">
          <img
            src="../assets/images/icons/logo.svg"
            alt="Logo"
            onerror="this.style.display='none'"
          />
          <h1 id="loginTitle">Super Servicios</h1>
          <p class="subtitle">Panel de administración</p>
        </div>

        <form id="loginForm" class="login-form" autocomplete="on">
          <label class="visually-hidden" for="email">Correo electrónico</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="Correo electrónico"
            required
          />

          <label class="visually-hidden" for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Contraseña"
            required
          />

          <button type="submit" class="btn-primary">Iniciar sesión</button>

          <div class="help">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>
        </form>
      </div>

      <footer class="login-footer">
        © <span id="year"></span> Super Servicios
      </footer>
    </div>

    <script type="module">
      import { api } from "../assets/services/api.js";

      document.getElementById("year").textContent = new Date().getFullYear();

      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const btn = document.querySelector('button[type="submit"]');

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = "Autenticando...";

        const email = emailInput.value;
        const password = passwordInput.value;

        try {
          const success = await api.auth.login(email, password);

          if (success) {
            window.location.href = "dashboard.html";
          } else {
            throw new Error("No se recibió el token de acceso.");
          }
        } catch (error) {
          console.error(error);
          alert("Error: Credenciales incorrectas o servidor no disponible.");
        } finally {
          btn.disabled = false;
          btn.textContent = originalText;
        }
      });
    </script>
  </body>
</html>
