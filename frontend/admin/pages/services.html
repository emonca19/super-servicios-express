<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard servicios</title>

  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <link rel="stylesheet" href="../assets/css/animation.css" />


  <style>
    body {
      background: #f5f6f8;
      font-family: 'Inter', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .content-area {
      display: flex;
      flex-direction: column;
      width: calc(100% - 260px);
      margin-left: 260px;
      height: 100vh;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    admin-navbar {
      flex-shrink: 0;
      transition: padding 0.3s ease;
    }

    main {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      overflow-x: hidden;
      transition: padding 0.3s ease;
    }

    /* SLIM MODE */
    body.slim .content-area {
      margin-left: 70px;
      width: calc(100% - 70px);
    }

    body.slim admin-navbar .navbar {
      padding-left: 1rem;
      padding-right: 1rem;
    }

    body.slim main {
      padding-left: 1rem;
      padding-right: 1rem;
    }

    /* Scrollbar de main */
    main::-webkit-scrollbar {
      width: 8px;
    }
    main::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 10px;
    }
    main::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
  </style>
</head>

<body>
  <!-- Restaurar modo slim lo antes posible -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("admin:sidebar:slim");
        if (saved === "1") {
          document.body.classList.add("slim");
        }
      } catch (e) {
        console.warn("[admin] no se pudo leer el modo slim del storage", e);
      }
    })();
  </script>

  <admin-sidebar></admin-sidebar>

  <div class="content-area">
    <admin-navbar></admin-navbar>

    <!-- data-page = "services" para el loader -->
    <main data-page="services">
      <services-page></services-page>
    </main>
  </div>

  <!-- Entry único del admin -->
  <script type="module" src="../assets/js/pages/admin-entry.js"></script>
</body>
</html>
