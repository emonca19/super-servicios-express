<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Cuenta - Auto Servicios Express</title>
  <!-- Backend API base (ensure api-client targets backend) -->
  <meta name="api-base" content="http://localhost:8000/api">
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
</head>
<body class="bg-gray-50">
  <header-component></header-component>

  <main class="min-h-screen py-12">
    <div class="container mx-auto px-6">
      <account-dashboard></account-dashboard>
    </div>
  </main>

  <footer-component></footer-component>

  <script type="module">
    try {
      await Promise.all([
        import('../assets/js/components/header/header-component.js'),
        import('../assets/js/components/footer-component/footer-component.js'),
        import('../assets/js/microfrontends/account/index.js')
      ]);
      console.log('[account] Microfrontend cargado');
    } catch (err) {
      console.error('[account] Error cargando microfrontend', err);
    }
  </script>
</body>
</html>
